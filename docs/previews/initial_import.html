<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="../../core/static/core/app.css"><style>body{margin:0}.button{display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border:1px solid #cfd5dc;border-radius:8px;background:#fff;color:#222;text-decoration:none;font-weight:700}.button.primary{background:#111;color:#fff;border-color:#111}</style></head><body class="simple-body"><header class="simple-header"><div class="simple-header-inner"><div class="simple-brand"><span class="simple-brand-mark">강</span><span><strong>강원 화물협회</strong><small>입금·미수금 업무</small></span></div><nav class="simple-nav"><a>입금대조</a><a class="active">명단</a><a>카드결제</a><a>미수금</a><a>문자</a></nav></div></header><main class="simple-main"><div class="simple-page-head"><div><span class="step-kicker">처음 한 번만</span><h1>기존 명단을 한꺼번에 불러오기</h1><p>한 명씩 입력하지 않습니다. 현재 사용 중인 두 파일을 그대로 선택하면 명단과 미수금을 자동으로 가져옵니다.</p></div></div><div class="import-workflow"><section class="import-step-card"><div class="import-step-number">1</div><div class="import-step-body"><h2>전체면허자현황 선택</h2><p>지역, 차량번호, 이름, 연락처, 주소, 가입일, 자격증명 발급일을 가져옵니다.</p><input type="file"></div></section><section class="import-step-card"><div class="import-step-number">2</div><div class="import-step-body"><h2>미수금 파일 선택</h2><p>계정, 기존 미수금, 비고와 명단 연결정보를 가져옵니다.</p><input type="file"></div></section><div class="import-submit-bar"><div><strong>두 파일을 선택하면 준비 끝</strong><span>같은 파일을 다시 올려도 중복 등록하지 않습니다.</span></div><button class="button primary large">기존 명단 불러오기</button></div></div></main></body></html>

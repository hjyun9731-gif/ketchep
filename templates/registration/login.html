{% load static %}
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인</title><link rel="stylesheet" href="{% static 'core/app.css' %}"></head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-visual">
      <div class="login-brand"><i>협</i><span>강원 화물협회</span></div>
      <div class="login-copy"><h2>복잡한 협회 업무를<br>한 화면에서 정리하세요.</h2><p>입금대조, 미수금, 회원정보, 문자발송과 환불업무를 연결해 처리합니다.</p></div>
    </section>
    <section class="login-card">
      <h1>업무관리 로그인</h1>
      <p class="muted">공용 관리자 계정으로 로그인하세요.</p>
      <form method="post">{% csrf_token %}{{ form.as_p }}{% if form.errors %}<div class="alert error">아이디 또는 비밀번호를 확인하세요.</div>{% endif %}<button class="button primary full">로그인</button></form>
    </section>
  </main>
</body>
</html>

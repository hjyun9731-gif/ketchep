{% load static %}
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로그인</title><link rel="stylesheet" href="{% static 'core/app.css' %}"></head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-visual">
      <div class="login-brand"><i>강</i><span>강원 화물협회</span></div>
      <div class="login-copy"><h2>입금대조부터<br>미수금까지 한곳에서.</h2><p>매일 반복하는 거래대조, 명단관리, 카드결제와 문자업무를 연결해 처리합니다.</p></div>
    </section>
    <section class="login-card">
      <h1>업무관리 로그인</h1><p class="muted">관리자 계정으로 로그인하세요.</p>
      <form method="post">{% csrf_token %}{{ form.as_p }}{% if form.errors %}<div class="alert error">아이디 또는 비밀번호를 확인하세요.</div>{% endif %}<button class="button primary full" type="submit">로그인</button></form>
    </section>
  </main>
</body>
</html>

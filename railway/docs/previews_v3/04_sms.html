<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../core/static/core/app.css"><title>04_sms</title></head><body><header class="app-header"><div class="header-inner"><a class="brand"><span class="brand-mark">강</span><span class="brand-copy"><strong>강원 화물협회</strong><span>입금·미수금 업무</span></span></a><nav class="primary-nav"><a class="">입금대조</a><a class="">명단</a><a class="">카드결제</a><a class="">미수금</a><a class="active">문자</a></nav><div class="header-actions"><details class="header-menu"><summary><span class="label">관리</span><span>▾</span></summary></details></div></div></header><main class="app-main">
<div class="page-head"><div class="page-title"><a class="back-link">← 문자발송</a><h1>미수금 문자 보내기</h1><p>보낼 사람을 고르고 납부기한과 발송 시점만 정하세요. 다음 화면에서 최종 문구를 확인합니다.</p></div></div><div class="sms-grid"><section class="card sms-recipient-card"><div class="card-head"><div><h2>1. 보낼 사람 선택</h2><p>연락처 없음·결번·수신거부 대상은 자동 제외됩니다.</p></div><span class="badge">3명 선택</span></div><div class="filter-bar"><input class="search" placeholder="이름·차량번호·전화번호 검색"><select><option>현재·폐업 전체</option></select><button class="button">찾기</button><button class="button">추가 조건</button></div><div class="recipient-toolbar"><label><input type="checkbox" checked> 보낼 수 있는 사람 전체 선택</label><span>검색 결과 4명</span></div><div class="recipient-list"><label class="recipient-row"><input type="checkbox" checked><span class="recipient-person"><strong>김현진</strong><small>강원81배1845 · 010-1234-5678</small></span><span class="recipient-status">정상</span><strong class="recipient-amount">15,000원</strong><span class="sendable">발송 가능</span></label><label class="recipient-row"><input type="checkbox" checked><span class="recipient-person"><strong>홍성표</strong><small>강원85배1423 · 010-2222-3333</small></span><span class="recipient-status">정상</span><strong class="recipient-amount">30,000원</strong><span class="sendable">발송 가능</span></label><label class="recipient-row disabled"><input type="checkbox" disabled><span class="recipient-person"><strong>한순례</strong><small>강원86자1025 · 전화번호 없음</small></span><span class="recipient-status">정상</span><strong class="recipient-amount">20,000원</strong><span class="not-sendable">번호 없음</span></label></div></section><aside class="card sms-settings"><h2>2. 발송 설정</h2><p>버튼을 눌러도 바로 발송되지 않습니다.</p><div class="setting-field"><label class="field-label">납부기한</label><input type="date" value="2026-08-18"></div><div class="setting-field"><span class="field-label">보내는 시점</span><div class="send-mode"><label><input type="radio" checked><span><b>지금</b><small>확인 후 바로 발송</small></span></label><label><input type="radio"><span><b>예약</b><small>날짜와 시간 지정</small></span></label></div></div><div class="side-summary"><span>선택한 대상</span><strong>3명</strong></div><button class="button primary large full">문자 내용 확인</button><p class="side-help">다음 화면에서 수신자와 문구를 다시 확인합니다.</p></aside></div></main></body></html>
